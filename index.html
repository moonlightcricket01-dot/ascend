<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d18"><meta name="description" content="ASCEND — a fully offline anime-inspired fitness RPG, workout planner and personal execution system."><meta name="color-scheme" content="dark"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png"><title>ASCEND — Offline Fitness RPG</title><style>
:root{--bg:#090d18;--panel:#111a2b;--panel2:#17243a;--line:#263653;--text:#edf4ff;--muted:#9aabc4;--cyan:#5ee7ff;--violet:#a78bfa;--gold:#ffd166;--green:#70e1a1;--red:#ff7785;--r:18px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#1a2d4d 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.shell{max-width:1440px;margin:auto;min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;background:#0b1120eF}.brand{font-weight:950;letter-spacing:4px;font-size:23px}.brand span{color:var(--cyan)}.tag{color:var(--muted);font-size:11px;letter-spacing:2px;margin:0 0 28px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:12px;color:var(--muted)}.nav button.active,.nav button:hover{background:#1a2942;color:var(--cyan)}.sidefoot{position:absolute;bottom:20px;color:var(--muted);font-size:12px}.main{padding:26px clamp(16px,3vw,42px) 80px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--cyan);font-weight:800}.h1{font-size:clamp(25px,4vw,36px);margin:2px 0;font-weight:850;letter-spacing:-1px}.sub{color:var(--muted)}.pill{border:1px solid var(--line);background:#101a2b;padding:8px 12px;border-radius:999px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:15px}.card{background:linear-gradient(145deg,#142138,#101827);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:0 12px 32px #0002}.span12{grid-column:span 12}.span8{grid-column:span 8}.span7{grid-column:span 7}.span6{grid-column:span 6}.span5{grid-column:span 5}.span4{grid-column:span 4}.span3{grid-column @media(max-width:850px){.shell{display:block}.side{display:none}.main{padding:18px 14px 90px}.span8,.span7,.span6,.span5,.span4,.span3{grid-column:span 12}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;overflow:auto;background:#0b1120f5;border-top:1px solid var(--line);padding:7px;gap:5px}.mobilebar button{flex:1;min-width:55px;border:0;background:transparent;color:var(--muted);font-size:10px;padding:7px 3px}.mobilebar button.active{color:var(--cyan)}.top{align-items:flex-start}.formgrid{grid-template-columns:1fr 1fr}}

</style></head><body><div class="shell"><aside class="side"><div class="brand">ASC<span>END</span></div><div class="tag">YOUR REAL-WORLD RPG</div><nav class="nav" id="nav" aria-label="Primary navigation"></nav><div class="sidefoot">Build strength. Keep your agency.<br>Progress without pressure.</div></aside><main class="main"><header class="top"><div><div class="eyebrow" id="eyebrow">PLAYER TERMINAL</div><div class="h1" id="pageTitle">Dashboard</div><div class="sub" id="pageSub">Every small action counts.</div></div><div class="row"><span class="pill" id="rankPill">E-RANK</span><span class="pill" id="datePill"></span></div></header><div id="view" role="region" aria-label="Current app screen" aria-live="polite"></div></main></div><nav class="mobilebar" id="mobileNav" aria-label="Mobile primary navigation"></nav><div id="toast" class="toast hidden" role="status"></div><script src="app.js"></script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
